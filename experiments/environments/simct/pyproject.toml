[project]
name = "simct-native-cu128"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kdflow",
  "sglang==0.5.9",
  "torch==2.9.1+cu128",
  "torchvision==0.24.1+cu128",
  "torchaudio==2.9.1+cu128",
  "transformers==4.57.1",
  "flash-attn==2.8.3",
  "pytest>=8.4,<9",
  "ninja",
  "packaging",
  "psutil",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
kdflow = { path = "../../..", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
