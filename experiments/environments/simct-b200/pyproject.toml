[project]
name = "simct-native-b200-cu130"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kdflow",
  # 0.5.11 is the first upstream release whose default stack is
  # CUDA 13 + Torch 2.11, matching Blackwell/B200.
  "sglang==0.5.11",
  "torch==2.11.0+cu130",
  "torchvision==0.26.0+cu130",
  "torchaudio==2.11.0+cu130",
  "transformers==5.6.0",
  # Transformers 5.6.0 constructs LayerRepository entries without a revision.
  # kernels>=0.15 tightened that constructor contract and breaks even offline
  # Llama AutoConfig/AutoTokenizer imports before training starts.
  "kernels==0.14.1",
  "pytest>=8.4,<9",
  "ninja",
  "packaging",
  "psutil",
  "tensorboard>=2.20,<3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
kdflow = { path = "../../..", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
