<!doctype html><meta charset="utf-8"><title>Campaign evaluation · training and evaluation seeds</title>
<style>body{font:15px system-ui;margin:24px;background:#f5f7fa;color:#152438}h1{font-size:25px}select{padding:8px;max-width:95%;margin:4px}label{display:inline-block;margin-right:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:16px}.card{background:white;border:1px solid #dce2e9;border-radius:10px;padding:16px}svg{width:100%;height:auto}.muted{color:#526375}.warn{background:#fff1cf;padding:12px}td,th{padding:7px;text-align:left}table{font-size:13px;border-collapse:collapse}tr{border-bottom:1px solid #e1e6ed}.key{display:inline-block;margin-right:14px}#runChecks{padding:12px}button{padding:7px;margin:5px}</style>
<h1>Campaign evaluation</h1>
<p class="warn">Raw scorer results. LCBfix is incomplete; LCB and macro remain provisional. Evaluation seeds 42/43/44 are repeated decoding of one checkpoint, not independent training runs. Missing cells are not zero.</p>
<label>View <select id="mode"><option value="single">One training run · all 3 eval seeds</option><option value="group">Training-seed group · mean across eval seeds per run</option></select></label>
<select id="choice"></select><div id="runChecks"></div><p id="status" class="muted"></p><main class="grid" id="charts"></main>
<script>
const D=__DATA__, colors=['#2166c2','#d05819','#20844b','#a23cb8'], S=[42,43,44], B=['gsm8k','math500','mbpp','live-code-bench-v6','macro'];
const mode=document.querySelector('#mode'),choice=document.querySelector('#choice');
function el(tag,text){let x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}
function options(){choice.replaceChildren();let vals=mode.value==='single'?Object.keys(D.runs):[...new Set(Object.values(D.runs).filter(r=>r.primary).map(r=>r.group))];vals.sort().forEach(v=>{let o=el('option',v);o.value=v;choice.append(o)});checks()}
function checks(){let box=document.querySelector('#runChecks');box.replaceChildren();if(mode.value==='group'){Object.entries(D.runs).filter(([k,r])=>r.primary&&r.group===choice.value).sort((a,b)=>a[1].train_seed-b[1].train_seed).forEach(([k,r])=>{let l=el('label');let c=el('input');c.type='checkbox';c.checked=true;c.value=k;c.onchange=draw;l.append(c,document.createTextNode('training seed '+r.train_seed));box.append(l)})}draw()}
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length}function std(a){return a.length<2?null:Math.sqrt(a.reduce((s,v)=>s+(v-avg(a))**2,0)/(a.length-1))}
function svgEl(tag,attrs,text){let n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;return n}
function draw(){const group=mode.value==='group',names=group?[...document.querySelectorAll('#runChecks input:checked')].map(x=>x.value):[choice.value];const root=document.querySelector('#charts');root.replaceChildren();document.querySelector('#status').textContent=group?`${names.length} selected training runs. Each point uses only runs with all 3 eval seeds; n is shown below. Sample SD is absent when n=1. No interpolation or extrapolation of missing checkpoints.`:`Training seed ${D.runs[names[0]]?.train_seed ?? 'unverified'} · ${D.runs[names[0]]?.training_status}. Eval seeds 42, 43, 44 always remain visible in the legend; missing observations show —.`;
 for(const b of B){let card=el('section');card.className='card';card.append(el('h3',b));let pts=D.points.filter(p=>names.includes(p.run)&&p.benchmark===b);let steps=[...new Set([...pts.map(p=>p.step),...names.flatMap(n=>D.runs[n].expected_steps)])].sort((a,b)=>a-b),series=[],summary=[];
 if(!group){for(const [i,s] of S.entries())series.push({name:'eval seed '+s,color:colors[i],values:steps.map(x=>[x,pts.find(p=>p.step===x)?.eval_scores[s]??null])});series.push({name:'eval mean (3/3)',color:'#152438',values:steps.map(x=>[x,pts.find(p=>p.step===x)?.mean??null])});summary=steps.map(x=>{let p=pts.find(p=>p.step===x);return [x,...S.map(s=>p?.eval_scores[s]??null),p?.mean??null,p?.eval_std??null]})}
 else{names.forEach((n,i)=>series.push({name:'train seed '+D.runs[n].train_seed,color:colors[i%4],values:steps.map(x=>[x,pts.find(p=>p.run===n&&p.step===x)?.mean??null])}));let vals=steps.map(x=>{let v=pts.filter(p=>p.step===x&&p.mean!==null).map(p=>p.mean);summary.push([x,v.length,v.length?avg(v):null,std(v)]);return [x,v.length?avg(v):null]});series.push({name:'training-run mean',color:'#152438',values:vals});}
 let legend=el('div');for(let s of series){let k=el('span','● '+s.name);k.className='key';k.style.color=s.color;legend.append(k)}card.append(legend);
 let svg=svgEl('svg',{viewBox:'0 0 570 300',role:'img','aria-label':b+' evaluation curves'});const xx=x=>55+(x/Math.max(312,...steps))*485, yy=y=>255-y*220;
 for(let v=0;v<=1.001;v+=.2){svg.append(svgEl('line',{x1:55,x2:540,y1:yy(v),y2:yy(v),stroke:'#e2e7ec'}),svgEl('text',{x:6,y:yy(v)+5,'font-size':12},Math.round(v*100)+'%'))}for(let x of steps)svg.append(svgEl('text',{x:xx(x),y:278,'text-anchor':'middle','font-size':10},x));
 if(group){for(let row of summary){let [x,n,mean,sd]=row;if(sd!==null){svg.append(svgEl('line',{x1:xx(x),x2:xx(x),y1:yy(mean-sd),y2:yy(mean+sd),stroke:'#152438','stroke-width':2}));}}}
 for(let s of series){let prev=null;for(let [x,y] of s.values){if(y===null){prev=null;continue}if(prev)svg.append(svgEl('line',{x1:xx(prev[0]),y1:yy(prev[1]),x2:xx(x),y2:yy(y),stroke:s.color,'stroke-width':s.color==='#152438'?3:1.6}));let c=svgEl('circle',{cx:xx(x),cy:yy(y),r:3.5,fill:s.color});c.append(svgEl('title',{},`${s.name}: step ${x}, ${(y*100).toFixed(3)}%`));svg.append(c);prev=[x,y]}}card.append(svg);
 let table=el('table'),head=el('tr');(group?['step','training n','mean %','training SD (pp)']:['step','eval42 %','eval43 %','eval44 %','mean %','eval SD (pp)']).forEach(v=>head.append(el('th',v)));table.append(head);summary.forEach(row=>{let tr=el('tr');row.forEach((v,i)=>tr.append(el('td',v===null?'—':i===0||(group&&i===1)?v:(v*100).toFixed(3))));table.append(tr)});card.append(table);if(group){for(const n of names){card.append(el('h4','Training seed '+D.runs[n].train_seed+' · all eval seeds'));let t=el('table'),h=el('tr');['step','eval42 %','eval43 %','eval44 %'].forEach(x=>h.append(el('th',x)));t.append(h);for(const x of steps){let p=pts.find(p=>p.run===n&&p.step===x),tr=el('tr');tr.append(el('td',x));for(const seed of S){let v=p?.eval_scores[seed];tr.append(el('td',v===undefined?'—':(v*100).toFixed(3)))}t.append(tr)}card.append(t)}}root.append(card)}
}
mode.onchange=options;choice.onchange=checks;options();
</script>
